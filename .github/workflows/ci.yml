name: CI
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  repo-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Repo checks
        run: scripts/check.sh

  android:
    if: hashFiles('android/gradlew') != ''
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6.4.0
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.4.0
        with:
          cache-read-only: false
      - name: Assemble debug and release, unit tests, lint
        run: ./gradlew :app:assembleDebug :app:assembleRelease :app:testDebugUnitTest :app:lintDebug --console=plain
      - name: Static analysis (ktlint + detekt)
        run: ./gradlew ktlintCheck detekt test --console=plain
      - name: Upload Android Lint report
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: lint-report
          path: android/app/build/reports/lint-results-debug.*
          if-no-files-found: error
          retention-days: 30
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: test-results
          path: android/app/build/test-results/testDebugUnitTest/*.xml
          if-no-files-found: error
          retention-days: 30
