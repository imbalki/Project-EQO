name: CI
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  repo-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Repo checks
        run: scripts/check.sh

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Skip if the android module is absent
        id: android_gate
        if: hashFiles('android/gradlew') != ''
        run: echo "present=true" >> "$GITHUB_OUTPUT"
      - name: Set up JDK 21 (Temurin)
        if: steps.android_gate.outputs.present == 'true'
        uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6.4.0
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.4.0
        with:
          cache-read-only: false
      - name: Assemble debug and release, unit tests, lint
        if: steps.android_gate.outputs.present == 'true'
        # Project-wide commands so every included module (currently :app plus the
        # TASK-004 core modules) is covered - not only :app.
        run: ./gradlew assembleDebug assembleRelease testDebugUnitTest lintDebug --console=plain
      - name: Static analysis (ktlint + detekt)
        if: steps.android_gate.outputs.present == 'true'
        run: ./gradlew ktlintCheck detekt test --console=plain
      - name: Upload Android Lint report
        if: always() && steps.android_gate.outputs.present == 'true'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: lint-report
          path: android/**/build/reports/lint-results-debug.*
          if-no-files-found: error
          retention-days: 30
      - name: Upload test results
        if: always() && steps.android_gate.outputs.present == 'true'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: test-results
          path: android/**/build/test-results/testDebugUnitTest/*.xml
          if-no-files-found: error
          retention-days: 30
