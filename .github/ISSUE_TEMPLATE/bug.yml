name: Bug
description: Something is broken
labels: ["type:bug"]
body:
  - type: textarea
    id: what
    attributes: { label: What happened }
    validations: { required: true }
  - type: textarea
    id: steps
    attributes: { label: Steps to reproduce }
    validations: { required: true }
  - type: textarea
    id: expected
    attributes: { label: Expected behavior }
