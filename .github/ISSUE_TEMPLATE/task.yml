name: Task
description: A unit of work for one agent or person
labels: ["agent:unassigned"]
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What outcome is needed
    validations: { required: true }
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: Directories to touch, and what is out of scope
    validations: { required: true }
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Checklist a reviewer can verify
    validations: { required: true }
  - type: textarea
    id: context
    attributes:
      label: Context and links
