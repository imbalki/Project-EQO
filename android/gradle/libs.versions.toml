[versions]
agp = "9.3.1"
kotlin = "2.4.0"
ktlint-gradle = "14.2.0"
detekt = "1.23.8"
junit = "4.13.2"

# Upstream-verified versions (yashab-cyber/opendroid @ 6ff5a061, app/build.gradle).
# Hilt/KSP pins are the upstream ones (2.60.1 / 2.3.10), verified to work with
# AGP 9.3.1 + Kotlin 2.4.0 in the upstream build (docs/build/agp9-migration.md).
hilt = "2.60.1"
ksp = "2.3.10"
room = "2.8.4"
datastore = "1.1.1"
okhttp = "5.4.0"
retrofit = "3.0.0"
kotlinxSerialization = "1.8.1"
coroutines = "1.10.2"
work = "2.11.2"
androidxCore = "1.18.0"
androidxTestCore = "1.6.1"
androidxTestRunner = "1.7.0"
mlkitGenai = "1.0.0-beta2"
robolectric = "4.16.1"
litertlm = "0.14.0"
# TASK-007: forked Shizuku helper dependencies (pins taken from the upstream build files
# at the study commits: Shizuku b844bc49 settings.gradle, Shizuku-API a27f6e41 settings.gradle).
hiddenApi = "4.4.0"
gson = "2.13.1"
parcelablelist = "2.0.1"
# TASK-008: wireless-ADB pairing stack (donor pins from app/build.gradle.kts at 75dae265,
# except Conscrypt upgraded for 16 KB native LOAD alignment; see TASK-008 evidence section 6).
bouncycastle = "1.84"
conscrypt = "2.7.0"
eddsa = "0.3.0"

[libraries]
junit = { module = "junit:junit", version.ref = "junit" }
hilt-android = { module = "com.google.dagger:hilt-android", version.ref = "hilt" }
hilt-android-testing = { module = "com.google.dagger:hilt-android-testing", version.ref = "hilt" }
hilt-compiler = { module = "com.google.dagger:hilt-compiler", version.ref = "hilt" }
ksp-api = { module = "com.google.devtools.ksp:symbol-processing-api", version.ref = "ksp" }
room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
room-testing = { module = "androidx.room:room-testing", version.ref = "room" }
datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }
okhttp-bom = { module = "com.squareup.okhttp3:okhttp-bom", version.ref = "okhttp" }
okhttp = { module = "com.squareup.okhttp3:okhttp" }
okhttp-logging = { module = "com.squareup.okhttp3:logging-interceptor" }
mockwebserver3 = { module = "com.squareup.okhttp3:mockwebserver3" }
okhttp-tls = { module = "com.squareup.okhttp3:okhttp-tls" }
retrofit = { module = "com.squareup.retrofit2:retrofit", version.ref = "retrofit" }
converter-gson = { module = "com.squareup.retrofit2:converter-gson", version.ref = "retrofit" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
work-runtime-ktx = { module = "androidx.work:work-runtime-ktx", version.ref = "work" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidxCore" }
androidx-test-core = { module = "androidx.test:core", version.ref = "androidxTestCore" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTestRunner" }
mlkit-genai-prompt = { module = "com.google.mlkit:genai-prompt", version.ref = "mlkitGenai" }
litertlm-android = { module = "com.google.ai.edge.litertlm:litertlm-android", version.ref = "litertlm" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
hidden-compat = { module = "dev.rikka.hidden:compat", version.ref = "hiddenApi" }
hidden-stub = { module = "dev.rikka.hidden:stub", version.ref = "hiddenApi" }
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
parcelablelist = { module = "dev.rikka.rikkax.parcelablelist:parcelablelist", version.ref = "parcelablelist" }
# TASK-008: wireless-ADB pairing stack (:adb-pairing).
bcprov = { module = "org.bouncycastle:bcprov-jdk18on", version.ref = "bouncycastle" }
bcpkix = { module = "org.bouncycastle:bcpkix-jdk18on", version.ref = "bouncycastle" }
conscrypt-android = { module = "org.conscrypt:conscrypt-android", version.ref = "conscrypt" }
eddsa = { module = "net.i2p.crypto:eddsa", version.ref = "eddsa" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint-gradle" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
