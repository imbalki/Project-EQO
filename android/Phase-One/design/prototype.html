<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EQO clickable prototype (Warm)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,500;6..72,600&display=swap" rel="stylesheet">
<style>
:root{--page:#F7F5F2;--pink:#26231F;--pmut:#6A645C;--pline:#E4DED5}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--pink);font:14px/1.5 "Figtree",system-ui,"Noto Sans",sans-serif}
button{font-family:inherit}
/* slim warm scrollbars everywhere (overlay-style, no arrows) */
*{scrollbar-width:thin;scrollbar-color:#D8CDBE transparent}
*::-webkit-scrollbar{width:6px;height:6px}*::-webkit-scrollbar-track{background:transparent}*::-webkit-scrollbar-thumb{background:#D8CDBE;border-radius:99px}*::-webkit-scrollbar-button{display:none;width:0;height:0}*::-webkit-scrollbar-thumb:hover{background:#C4B5A0}
.app{display:grid;grid-template-columns:250px minmax(0,1fr) 290px;gap:20px;max-width:1280px;margin:0 auto;padding:16px}
@media (max-width:1100px){.app{grid-template-columns:minmax(0,1fr)}}
header.bar{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:space-between}
header.bar h1{font:600 22px/1.2 "Newsreader",Georgia,serif;margin:0}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13px;color:var(--pmut)}
.seg{display:inline-flex;border:1px solid var(--pline);border-radius:99px;padding:3px;gap:2px;background:#fff}
.seg button{border:0;background:transparent;color:var(--pmut);font:600 12px "Figtree",sans-serif;padding:6px 12px;border-radius:99px;cursor:pointer;min-height:32px}
.seg button[aria-pressed="true"]{background:var(--pink);color:#fff}
nav.flows{border:1px solid var(--pline);border-radius:16px;background:#fff;padding:10px;max-height:calc(100vh - 90px);overflow:auto;position:sticky;top:12px;align-self:start}
nav.flows h2{font:700 12px/1 "Figtree",sans-serif;letter-spacing:.07em;text-transform:uppercase;color:var(--pmut);margin:12px 6px 6px}
nav.flows h2:first-child{margin-top:4px}
nav.flows a{display:block;padding:6px 8px;border-radius:9px;color:var(--pink);text-decoration:none;font-size:13px}
nav.flows a:hover{background:#F5EFE7}
nav.flows a[aria-current="page"]{background:#F9E4D8;color:#5C2612;font-weight:600}
.stage{display:grid;justify-items:center;align-content:start;gap:10px}
aside.notes{border:1px solid var(--pline);border-radius:16px;background:#fff;padding:14px 16px;font-size:13px;position:sticky;top:12px;align-self:start}
aside.notes h2{font:600 16px/1.3 "Newsreader",Georgia,serif;margin:0 0 6px}
aside.notes dl{margin:8px 0 0}
aside.notes dt{font:700 12px/1 "Figtree",sans-serif;letter-spacing:.06em;text-transform:uppercase;color:var(--pmut);margin:12px 0 4px}
aside.notes dd{margin:0;color:var(--pink)}
.tag{display:inline-block;border:1px solid var(--pline);border-radius:99px;padding:1px 8px;margin:0 4px 4px 0;font-size:12px;color:var(--pmut)}
/* Warm (clay) */
.phone{--bg:#FBF8F4;--surface:#FFFFFF;--tonal:#F5EFE7;--line:#EBE3D8;--field:#8F857A;--ink:#2D2A26;--muted:#6B655D;--primary:#B04E2B;--on-primary:#FFFFFF;--pc:#F9E4D8;--on-pc:#5C2612;--ready:#2F6F4F;--ready-bg:#E4F1E8;--attn:#6F4A00;--attn-bg:#FCEFD0;--stop:#A8352B;--stop-bg:#FBE7E3;--glow:#FDEBDD;--edge:#D9D1C5;--fs:1}
.phone{width:390px;max-width:100%;border-radius:34px;border:7px solid var(--edge);background:var(--bg);overflow:hidden;color:var(--ink);font-family:"Figtree","Noto Sans",system-ui,sans-serif;position:relative}
.screen{height:760px;display:flex;flex-direction:column;gap:0;padding:0 20px 16px;background:linear-gradient(180deg,var(--glow) 0,var(--bg) 200px);overflow-y:auto;scrollbar-gutter:auto}
.screen.sysbg{background:#F1F1F1;color:#1B1B1B}
.screen h2:focus{outline:none}
.status{display:flex;justify-content:space-between;font:600 12px "Figtree",sans-serif;color:var(--muted);padding:10px 4px 2px;flex:none}
.top{display:flex;align-items:center;gap:8px;min-height:48px;flex:none}
.back{width:48px;height:48px;border-radius:99px;display:grid;place-items:center;margin-inline-start:-10px;color:var(--ink);background:transparent;border:0;cursor:pointer;flex:none}
.back svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
[dir=rtl] .flip{transform:scaleX(-1)}
.brand{font:600 calc(18px*var(--fs))/1 "Newsreader",Georgia,serif;letter-spacing:.01em}
.t-display{font:500 calc(26px*var(--fs))/1.2 "Newsreader",Georgia,serif;margin:4px 0 6px}
.t-head{font:500 calc(22px*var(--fs))/1.25 "Newsreader",Georgia,serif;margin:2px 0 4px}
.t-title{font:600 calc(15px*var(--fs))/1.35 "Figtree",sans-serif;margin:0}
.t-body{font:400 calc(14px*var(--fs))/1.45 "Figtree",sans-serif;color:var(--muted);margin:0}
.t-ink{color:var(--ink)}
.t-label{font:600 calc(12px*var(--fs))/1.35 "Figtree",sans-serif}
.gap{height:12px;flex:none}.gap-s{height:8px;flex:none}
.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:4px 16px;flex:none}
.pad{padding:14px 16px}
.tonal{background:var(--tonal);border-radius:20px;padding:12px 14px;display:flex;gap:12px;align-items:flex-start;flex:none}
.ico{width:40px;height:40px;border-radius:14px;background:var(--pc);color:var(--on-pc);display:grid;place-items:center;flex:none}
.ico svg,.mark svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.row{display:flex;align-items:center;gap:12px;min-height:60px;padding:6px 0;border-bottom:1px solid var(--line);width:100%;background:transparent;border-inline:0;border-top:0;text-align:start;color:inherit;cursor:pointer}
.row:last-child{border-bottom:0}.row.slim{min-height:48px}
.row .t{flex:1;min-width:0}
.row small{display:block;font:400 calc(12px*var(--fs))/1.35 "Figtree",sans-serif;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:6px;font:600 calc(12px*var(--fs))/1.3 "Figtree",sans-serif;border-radius:99px;padding:5px 11px;white-space:nowrap}
.chip svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.c-ready{background:var(--ready-bg);color:var(--ready)}.c-todo{background:var(--tonal);color:var(--ink)}.c-off{background:transparent;color:var(--muted);border:1px solid var(--line)}.c-attn{background:var(--attn-bg);color:var(--attn)}.c-stop{background:var(--stop-bg);color:var(--stop)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;border-radius:99px;font:600 calc(15px*var(--fs)) "Figtree",sans-serif;border:0;padding:6px 24px;width:100%;cursor:pointer;text-align:center;flex:none}
.btn-primary{background:var(--primary);color:var(--on-primary)}.btn-tonal{background:var(--pc);color:var(--on-pc)}.btn-text{background:transparent;color:var(--primary);min-height:48px}.btn-stop{background:var(--stop-bg);color:var(--stop)}.btn-soft{background:var(--tonal);color:var(--ink)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.progress{height:8px;border-radius:99px;background:var(--tonal);overflow:hidden;flex:none}.progress i{display:block;height:100%;background:var(--primary);border-radius:99px;transition:width .3s}
.mark{width:84px;height:84px;border-radius:30px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;box-shadow:0 10px 30px color-mix(in srgb,var(--primary) 14%,transparent);color:var(--primary)}
.mark svg{width:46px;height:46px;stroke-width:1.6}
.grow{flex:1;min-height:10px}.stack{display:grid;gap:10px}.stack-s{display:grid;gap:8px}
.dots{display:flex;gap:6px;justify-content:center;margin:10px 0}.dots i{width:7px;height:7px;border-radius:99px;background:var(--line)}.dots i.on{background:var(--primary);width:20px}
.list{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.list li{display:flex;gap:10px;align-items:flex-start;font:400 calc(14px*var(--fs))/1.45 "Figtree",sans-serif;color:var(--ink)}
.list li svg{width:18px;height:18px;flex:none;margin-top:1px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.yes svg{color:var(--ready)}.no svg{color:var(--stop)}
.path{background:var(--tonal);border-radius:14px;padding:10px 12px;font:500 calc(13px*var(--fs))/1.45 "Figtree",sans-serif;color:var(--ink);flex:none}
.attn{background:var(--attn-bg);border-radius:22px;padding:14px 16px;color:var(--ink);flex:none}.attn .t-title{color:var(--attn)}
.err{background:var(--stop-bg);border-radius:22px;padding:14px 16px;color:var(--ink);flex:none}.err .t-title{color:var(--stop)}
.quote{background:var(--surface);border-radius:16px;padding:10px 14px;margin:8px 0 12px;font:400 calc(14px*var(--fs))/1.45 "Figtree",sans-serif}
.pair{display:grid;grid-template-columns:1.2fr 1fr;gap:10px}
.ctl{display:grid;grid-template-columns:112px 1fr;gap:12px;align-items:center;padding:3px 0}
.ctl .btn{min-height:48px;padding:0 8px;font-size:calc(14px*var(--fs))}
.ctl p{margin:0;font:400 calc(13px*var(--fs))/1.4 "Figtree",sans-serif;color:var(--muted)}
.run{display:grid;gap:10px}.run .s{display:flex;gap:12px;align-items:center;font:500 calc(14px*var(--fs))/1.4 "Figtree",sans-serif}
.run .s small{margin-inline-start:auto;font:500 calc(12px*var(--fs)) "Figtree",sans-serif;color:var(--muted)}
.dot{width:24px;height:24px;border-radius:99px;display:grid;place-items:center;flex:none;background:var(--tonal);color:var(--muted);font:700 12px "Figtree",sans-serif}
.dot svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.dot.done{background:var(--ready-bg);color:var(--ready)}.dot.now{background:var(--attn-bg);color:var(--attn)}.dot.bad{background:var(--stop-bg);color:var(--stop)}
.field{display:grid;gap:6px}.field label{font:600 calc(13px*var(--fs))/1.3 "Figtree",sans-serif}
.field input{min-height:52px;border-radius:16px;border:1.5px solid var(--field);background:var(--surface);padding:0 14px;font:500 calc(15px*var(--fs)) "Figtree",sans-serif;color:var(--ink)}
.field input:focus{outline:2.5px solid var(--primary);outline-offset:1px}
.btn:focus-visible,.row:focus-visible,.back:focus-visible,a:focus-visible,.seg button:focus-visible,.tog:focus-visible{outline:2.5px solid var(--primary);outline-offset:2px}
.sys{background:#fff;border-radius:28px;padding:22px 22px 14px;color:#1B1B1B;box-shadow:0 8px 28px rgba(0,0,0,.18);flex:none}
.sys h3{font:500 20px/1.3 "Noto Sans","Figtree",sans-serif;margin:0 0 10px}.sys p{font:400 14px/1.5 "Noto Sans","Figtree",sans-serif;color:#444746;margin:0 0 16px}
.sys .act{display:flex;justify-content:flex-end;gap:8px}.sys .act button{border:0;background:transparent;color:#0B57D0;font:500 14px "Noto Sans",sans-serif;padding:10px 14px;border-radius:99px;min-height:48px;cursor:pointer}
.ribbon{background:#1B1B1B;color:#fff;border-radius:99px;font:600 12px "Figtree",sans-serif;padding:5px 12px;width:max-content;margin:8px auto}
.sysrow{display:flex;justify-content:space-between;align-items:center;background:#fff;border-radius:18px;padding:6px 16px;margin-top:8px;font:500 15px "Noto Sans",sans-serif;min-height:56px;color:#1B1B1B}
.tog{width:60px;height:48px;background:transparent;position:relative;border:0;cursor:pointer;flex:none}.tog::before{content:"";position:absolute;top:8px;inset-inline-start:4px;width:52px;height:32px;border-radius:99px;background:#79747E;transition:.2s}.tog::after{content:"";position:absolute;top:12px;inset-inline-start:8px;width:24px;height:24px;border-radius:99px;background:#fff;transition:.2s}.tog[aria-checked="true"]::before{background:var(--primary)}.tog[aria-checked="true"]::after{inset-inline-start:32px}
.tog.sysblue[aria-checked="true"]::before{background:#0B57D0}
.bubble{max-width:85%;padding:10px 14px;border-radius:20px;font:400 calc(14px*var(--fs))/1.45 "Figtree",sans-serif}
.b-user{background:var(--primary);color:var(--on-primary);margin-inline-start:auto;border-end-end-radius:6px}.b-ai{background:var(--surface);border:1px solid var(--line);border-end-start-radius:6px}
.suggest{display:flex;flex-wrap:wrap;gap:8px}.suggest button{border:1px solid var(--field);background:var(--surface);color:var(--ink);border-radius:99px;padding:0 14px;min-height:48px;font:500 calc(13px*var(--fs)) "Figtree",sans-serif;cursor:pointer}
.composer{display:flex;gap:8px;align-items:center;background:var(--surface);border:1.5px solid var(--field);border-radius:99px;padding:6px 6px 6px 16px;flex:none}
.composer span{flex:1;color:var(--muted);font:400 calc(14px*var(--fs)) "Figtree",sans-serif}
.send{width:48px;height:48px;border-radius:99px;border:0;background:var(--primary);color:#fff;display:grid;place-items:center;cursor:pointer}.send svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.vtabs{display:flex;flex-wrap:wrap;gap:6px}.vtabs button{border:1px solid var(--field);background:var(--surface);border-radius:99px;min-height:48px;min-width:48px;padding:0 14px;font:600 calc(12px*var(--fs)) "Figtree",sans-serif;color:var(--ink);cursor:pointer}.vtabs button[aria-pressed="true"]{background:var(--pc);color:var(--on-pc);border-color:transparent}
.badge{display:inline-flex;gap:6px;align-items:center;background:var(--tonal);border-radius:99px;padding:4px 10px;font:600 calc(12px*var(--fs)) "Figtree",sans-serif;color:var(--ink)}
.badge svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
details.disc{background:var(--tonal);border-radius:16px;padding:0 14px;flex:none}details.disc summary{min-height:48px;display:flex;align-items:center;font:600 calc(13px*var(--fs)) "Figtree",sans-serif;cursor:pointer;color:var(--ink)}details.disc p{margin:0 0 12px}
.review{border:1px dashed var(--field);border-radius:16px;padding:8px 10px}
</style>
</head>
<body>
<div class="app">
  <header class="bar">
    <h1>EQO clickable prototype <span style="font:500 13px 'Figtree';color:var(--pmut)">Warm style, design only</span></h1>
    <div class="tools" role="group" aria-label="Review tools">
      <span>Text size</span><span class="seg" id="seg-fs"><button data-fs="1" aria-pressed="true">100%</button><button data-fs="1.3" aria-pressed="false">130%</button><button data-fs="1.6" aria-pressed="false">160%</button></span>
      <span>Direction</span><span class="seg" id="seg-dir"><button data-dir="ltr" aria-pressed="true">Left to right</button><button data-dir="rtl" aria-pressed="false">Right to left</button></span>
      <button class="seg" style="padding:8px 14px;cursor:pointer;font:600 12px Figtree" id="reset">Reset demo</button>
    </div>
  </header>
  <nav class="flows" id="flows" aria-label="Screens by flow"></nav>
  <main class="stage"><div class="phone" id="phone" dir="ltr"><div class="screen" id="screen"></div></div><p style="font-size:12px;color:var(--pmut);max-width:390px;margin:0">Mock data only. Dashed boxes are review controls, not part of the product. Android's own screens are grey with a black tag.</p></main>
  <aside class="notes" id="notes" aria-live="polite"></aside>
</div>
<script>
const P={
 logo:'<circle cx="12" cy="12" r="3"/><path d="M12 3c3 0 5.5 2 6 5M21 12c0 3-2 5.5-5 6M12 21c-3 0-5.5-2-6-5M3 12c0-3 2-5.5 5-6"/>',
 eye:'<path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12z"/><circle cx="12" cy="12" r="2.6"/>',hand:'<path d="M8 12V6a1.5 1.5 0 0 1 3 0v5M11 11V4.5a1.5 1.5 0 0 1 3 0V11M14 11V6a1.5 1.5 0 0 1 3 0v7a6 6 0 0 1-6 6h-1a5 5 0 0 1-4-2l-2-3a1.6 1.6 0 0 1 2.5-2L8 14"/>',
 key:'<circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M16 7l3 3"/>',screen:'<rect x="6" y="2.5" width="12" height="19" rx="3"/><path d="M10 18h4"/>',
 plug:'<path d="M9 3v5M15 3v5M6 8h12v3a6 6 0 0 1-12 0V8zM12 17v4"/>',globe:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/>',
 layers:'<path d="M12 3l9 5-9 5-9-5 9-5zM3 13l9 5 9-5"/>',chat:'<path d="M4 5h16v11H9l-5 4V5z"/>',check:'<path d="M5 12.5l4.5 4.5L19 7.5"/>',x:'<path d="M6 6l12 12M18 6L6 18"/>',
 back:'<path d="M15 5l-7 7 7 7"/>',cog:'<circle cx="12" cy="12" r="3"/><path d="M12 3v2.5M12 18.5V21M3 12h2.5M18.5 12H21M5.6 5.6l1.8 1.8M16.6 16.6l1.8 1.8M18.4 5.6l-1.8 1.8M7.4 16.6l-1.8 1.8"/>',
 send:'<path d="M4 12l16-8-6 16-3-7-7-1z"/>',doc:'<path d="M7 3h7l4 4v14H7z"/><path d="M14 3v4h4M10 12h5M10 16h5"/>',shield:'<path d="M12 3l8 3v6c0 4.5-3.2 7.8-8 9-4.8-1.2-8-4.5-8-9V6l8-3z"/><path d="M9 12l2.2 2.2L15 10"/>',
 list:'<path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/>',refresh:'<path d="M20 5v5h-5M4 19v-5h5M19 10a8 8 0 0 0-14-2M5 14a8 8 0 0 0 14 2"/>'
};
const ic=(n,cls='')=>`<svg class="${cls}" viewBox="0 0 24 24" aria-hidden="true" focusable="false">${P[n]}</svg>`;
const fresh=()=>({model:false,a11y:false,adb:[false,false,false,false,false],helper:false,browser:'off',chromeDebug:false,vd:'off',sms:'off',runStep:0,paused:false,tookOver:false,observe:false,fg:false,v:{}});
let S=fresh();
const clock='<div class="status"><span>9:41</span><span>LTE &nbsp;100%</span></div>';
const topbar=(back,right='')=>`<div class="top">${back?`<button class="back" data-go="${back}" aria-label="Back"><span class="flip">${ic('back')}</span></button>`:''}${right}</div>`;
const btn=(label,go,kind='primary',extra='')=>`<button class="btn btn-${kind}" data-go="${go}" ${extra}>${label}</button>`;
const actbtn=(label,act,kind='primary',extra='')=>`<button class="btn btn-${kind}" data-act="${act}" ${extra}>${label}</button>`;
const chip=(k,t,icon)=>`<span class="chip c-${k}">${icon?ic(icon):''}${t}</span>`;
const ready=()=>chip('ready','Ready','check');
const row=(icon,title,sub,right,go,cls='')=>`<button class="row ${cls}" data-go="${go}"><span class="ico">${ic(icon)}</span><span class="t"><p class="t-title">${title}</p><small>${sub}</small></span>${right}</button>`;
const vtabs=(key,opts,cur)=>`<div class="vtabs review" data-demo="1" role="group" aria-label="Review: variants">${opts.map(([k,l])=>`<button data-var="${key}:${k}" aria-pressed="${k===cur}">${l}</button>`).join('')}</div>`;
const cur=(k,d)=>S.v[k]||d;
const reqDone=()=>S.model&&S.a11y&&S.helper;
const sysScreen=(inner,tag='Android system screen, not EQO')=>`<div class="screen sysbg">${clock}<div class="ribbon">${tag}</div>${inner}</div>`;
const scr=(inner)=>`<div class="screen">${clock}${inner}</div>`;
const demoLink=(label,go)=>`<button class="btn btn-text review" data-demo="1" data-go="${go}">${label}</button>`;
const controls=()=>`<div class="card" role="group" aria-label="Task controls" style="padding:6px 14px"><div class="ctl">${actbtn('Pause','run.pause','soft')}<p>Pause after the current step finishes</p></div><div class="ctl">${actbtn('Take over','run.took','soft')}<p>You drive; EQO holds</p></div><div class="ctl">${btn('Stop','s24s','stop')}<p>Stop this task completely</p></div></div>`;
const SC={};
const def=(id,flow,title,reqs,src,note,render)=>{SC[id]={id,flow,title,reqs,src,note,render}};

def('s01','UF-01 First install','Welcome (S-01)','REQ-INS-01/03','USER-FLOWS UF-01 step 1','One idea, one button. Legal is reachable from the very first screen.',()=>scr(`<div class="grow"></div><div style="display:grid;place-items:center;gap:18px;text-align:center"><div class="mark">${ic('logo')}</div><div><div class="brand" style="font-size:22px">EQO</div><h2 class="t-display" style="margin-top:12px">Your Only Personal AI Assistant</h2><p class="t-body" style="max-width:300px;margin:0 auto">EQO helps with everyday tasks on your phone. You set it up step by step, and you approve anything sensitive.</p></div></div><div class="grow"></div><div class="dots"><i class="on"></i><i></i><i></i></div>${btn('Get started','s02')}${btn('Legal and licenses','s28','text')}`));
def('s02','UF-01 First install','Privacy primer (S-02)','REQ-PRIV-03/04','USER-FLOWS UF-01 step 2','Reassurance first, in three short cards. Redaction limits are stated plainly (principle 7).',()=>scr(`${topbar('s01')}<h2 class="t-display">Before we begin</h2><div class="gap"></div><div class="stack"><div class="tonal"><span class="ico">${ic('eye')}</span><div><p class="t-title">Only what a task needs</p><p class="t-body" style="margin-top:2px">EQO sends your AI model only what a task needs, and only after you approve screen content. Redaction is best-effort, so some private details may still show.</p></div></div><div class="tonal"><span class="ico">${ic('key')}</span><div><p class="t-title">Your key stays here</p><p class="t-body" style="margin-top:2px">Your API key is encrypted on this phone and never written to logs.</p></div></div><div class="tonal"><span class="ico">${ic('hand')}</span><div><p class="t-title">You stay in control</p><p class="t-body" style="margin-top:2px">EQO asks before anything sensitive. Pause or stop any time.</p></div></div></div>${btn('What exactly is sent?','s12i','text')}<div class="grow"></div><div class="dots"><i></i><i class="on"></i><i></i></div>${btn('Continue','s03')}`));
def('s03','UF-01 First install','Setup hub (S-03)','REQ-INS-01, REQ-ADB-12','USER-FLOWS UF-01 step 3, section 16.2','Rows change independently and use the spec states: Not set up, Ready, Needs attention (with the reason). A helper problem marks Browser control and Background mode as needing attention, never as silently ready.',()=>{
 const n=[S.model,S.a11y,S.helper].filter(Boolean).length;const dep=!S.helper;
 const need=chip('attn','Needs attention');
 const brow=S.browser==='ready'?ready():S.browser==='declined'?chip('off','Off (you declined)'):dep?need:chip('todo','Not set up');
 const vrow=S.vd==='ready'?ready():dep?need:chip('todo','Not set up');
 const srow=S.sms==='ready'?ready():chip('todo','Not set up');
 const next=!S.model?'s04':!S.a11y?'s06':!S.helper?'s08':'s20';
 return scr(`${topbar('s02',`<span class="brand" style="margin-inline-start:auto">EQO</span><button class="back" data-go="s19" aria-label="Readiness details" style="margin-inline-end:-10px">${ic('list')}</button>`)}<h2 class="t-display">${reqDone()?"You're all set":"Let's set up EQO"}</h2><p class="t-body">${reqDone()?'The required steps are ready. Optional ones can wait.':'Three steps are needed before EQO can run tasks.'}</p><div class="gap-s"></div><div style="display:flex;justify-content:space-between" class="t-label"><span>${n} of 3 required</span><span style="color:var(--muted);font-weight:500">About 10 to 15 min (estimate)</span></div><div class="gap-s"></div><div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="3" aria-valuenow="${n}" aria-label="Required steps done"><i style="width:${n/3*100}%"></i></div><div class="gap"></div><div class="card">${row('key','Model','Required',S.model?ready():chip('todo','Not set up'),'s04')}${row('screen','Screen control','Required',S.a11y?ready():chip('todo','Not set up'),'s06')}${row('plug','Helper connection','Required',S.helper?ready():chip('todo','Not set up'),'s08')}${row('globe','Browser control',dep&&S.browser==='off'?'Needs the helper first':'Optional',brow,'s12')}${row('layers','Background mode',dep&&S.vd==='off'?'Needs the helper first':'Optional',vrow,'s15')}${row('chat','Messages (SMS)','Optional',srow,'s26')}</div><div class="grow"></div>${btn(reqDone()?'Start using EQO':'Continue',next)}`)});
def('s04','UF-02 Model setup','Model setup (S-04)','REQ-BYOK-01/02/03, REQ-PRIV-02','USER-FLOWS UF-02','The key field masks input. After a pass, a 3-step self-test shows that EQO can plan and use tools.',()=>{
 const t=S.v.test||'idle';
 return scr(`${topbar('s03')}<h2 class="t-head">Connect your AI model</h2><p class="t-body">Paste your OpenRouter API key. It stays encrypted on this phone. OpenRouter may charge your account; EQO doesn't.</p><div class="gap"></div><div class="field"><label for="k">OpenRouter API key</label><input id="k" type="password" placeholder="Paste your key" autocomplete="off" value="${t==='pass'?'••••••••••••••••••••':''}"></div><div class="gap"></div>${t==='pass'?`<div class="card pad" role="status"><p class="t-title">Connected to OpenRouter</p><p class="t-body" style="margin:2px 0 10px">You can change models any time.</p><div class="run"><div class="s"><span class="dot done">${ic('check')}</span>Plan</div><div class="s"><span class="dot done">${ic('check')}</span>Tool call</div><div class="s"><span class="dot done">${ic('check')}</span>Verified answer</div></div></div>`:t==='run'?`<p class="t-body" role="status">Checking that EQO can plan and use tools…</p>`:''}<div class="grow"></div>${t==='pass'?actbtn('Continue','model.done'):actbtn(t==='run'?'Testing…':'Test connection','model.test','primary',t==='run'?'disabled':'')}${demoLink('See what an error looks like','s05')}`)});
def('s05','UF-02 Model setup','Model failure states (S-05)','REQ-BYOK-04','USER-FLOWS UF-02 step 2','Five distinct failures, each with one repair action. EQO never retries on its own (REQ-TASK-07).',()=>{
 const v=cur('s05','401');const D={
 '401':['Key not accepted','OpenRouter rejected this key. Check that you copied all of it.','Re-enter key'],
 '429':['Too many requests','Try again in 40 seconds. EQO won\'t retry on its own.','Try again'],
 'credit':['No credit left','Add credit at openrouter.ai/credits, then test again.','Open OpenRouter'],
 'model':['Model not supported','This model can\'t use EQO\'s tools. Choose another model.','Choose model'],
 'net':['No connection','EQO can\'t reach OpenRouter. Check your internet.','Try again']}[v];
 return scr(`${topbar('s04')}<h2 class="t-head">Couldn't connect</h2>${vtabs('s05',[['401','401'],['429','429'],['credit','Credit'],['model','Model'],['net','Network']],v)}<div class="gap"></div><div class="err" role="status"><p class="t-title">${D[0]}</p><p class="t-body t-ink" style="margin-top:4px">${D[1]}</p></div><div class="grow"></div>${btn(D[2],'s04')}`)});
def('s06','UF-03 Screen control','Screen control: why and how (S-06)','REQ-A11Y-01/03','USER-FLOWS UF-03','Explain before asking. Never claims a permission is granted; always "open settings, find EQO, turn on". Android names stay verbatim.',()=>scr(`${topbar('s03',`<span class="t-label" style="color:var(--muted);margin-inline-start:auto">Step 2 of 3</span>`)}<h2 class="t-head">Allow Screen control</h2><p class="t-body">This lets EQO read and tap the screen for you.</p><div class="gap"></div><div class="card pad"><p class="t-title" style="margin-bottom:6px">EQO can</p><ul class="list yes"><li>${ic('check')}<span>Read the screen during a task you start</span></li><li>${ic('check')}<span>Tap and type for you in that task</span></li></ul><p class="t-title" style="margin:12px 0 6px">EQO can't</p><ul class="list no"><li>${ic('x')}<span>Turn itself on. Only you can</span></li><li>${ic('x')}<span>Act on sensitive steps without asking</span></li></ul></div><div class="gap"></div>${S.a11y?`<p class="t-body" role="status">Screen control is on. You can turn it off any time in Android settings.</p>`:`<div class="path"><b>In Android settings:</b> Accessibility › Downloaded apps › EQO › On</div><p class="t-body" style="margin-top:8px">You can turn it off any time.</p>`}<div class="grow"></div>${S.a11y?btn('Continue','s03'):btn('Open Accessibility settings','s06b')}${S.a11y?'':btn('Switch dimmed or missing?','s07','text')}${S.a11y?'':btn('Not now','s03','text')}`));
def('s06b','UF-03 Screen control','Android Settings: Accessibility (system)','REQ-A11Y-03','Android-owned; shown to make the hand-off visible','This is Android, not EQO. EQO never flips this switch. On return, EQO re-checks and only then shows Ready.',()=>sysScreen(`<h3 style="font:500 22px 'Noto Sans';margin:6px 4px 8px">Accessibility</h3><div class="sysrow"><span>Downloaded apps</span><span aria-hidden="true">›</span></div><div class="sysrow"><span>EQO</span><button class="tog sysblue" role="switch" aria-checked="${S.v.a11ytog?'true':'false'}" aria-label="Use EQO" data-act="a11y.toggle"></button></div><p style="font:400 13px/1.5 'Noto Sans';color:#555;margin:12px 6px">EQO can read and tap the screen while this is on.</p><div class="grow"></div>${actbtn('Back to EQO','a11y.return','primary',S.v.a11ytog?'':'disabled')}`));
def('s07','UF-03 Screen control','Restricted settings repair (S-07)','REQ-A11Y-02 (Android 13+)','USER-FLOWS UF-03 step 3','Shown only on Android 13 and newer, and only when the person says the switch is blocked. EQO does not claim it can detect this. Wording varies by phone brand and is PENDING device validation.',()=>scr(`${topbar('s06')}<h2 class="t-head">Android may be blocking it</h2><div class="attn"><p class="t-title">This is Android's protection, not an EQO error</p><p class="t-body t-ink" style="margin-top:4px">Android restricts some apps installed outside the Play Store.</p></div><div class="gap"></div><div class="path"><b>Usual path:</b> Settings › Apps › EQO › ⋮ › Allow restricted settings</div><p class="t-body" style="margin-top:8px">Names can differ on your phone.</p><div class="grow"></div>${btn("Open EQO's app info",'s07i')}${btn("I've done it",'s06','soft')}`));
def('s07i','UF-03 Screen control','Android App info (system)','REQ-A11Y-02','Android-owned; illustrates the hand-off','Android\'s own screen. The exact menu wording varies by brand and OS version.',()=>sysScreen(`<h3 style="font:500 22px 'Noto Sans';margin:6px 4px 8px">App info</h3><div class="sysrow"><span>EQO</span><span aria-hidden="true">⋮</span></div><div class="sysrow"><span>Allow restricted settings</span><button class="tog sysblue" role="switch" aria-checked="${S.v.restr?'true':'false'}" aria-label="Allow restricted settings" data-act="restr.toggle"></button></div><div class="grow"></div>${btn('Back to EQO','s06')}`));
const ADB=[
 ['Developer options','Settings › About phone › tap Build number 7 times.','On some phones: About device › Version.'],
 ['Wi-Fi','Turn on Wi-Fi. Your phone and the helper use the same network.',''],
 ['Wireless debugging','Developer options › Wireless debugging › On.','Needs Android 11 or newer.'],
 ['Pair with a code','Tap Pair device with pairing code. Enter the 6-digit code and the pairing port shown in the popup.',''],
 ['Connect','On the main Wireless debugging screen, find IP address & port. That connection port is not the pairing port.','']];
def('s08','UF-04 Wireless ADB','Helper connection: guided checks (S-08)','REQ-ADB-01..06, 12','USER-FLOWS UF-04','Each check is separate. "Pairing port" and "Connection port" are always two named things (principle 4). Passed checks persist when you go back.',()=>{
 const a=S.adb;const act=a.findIndex(x=>!x);const done=a.filter(Boolean).length;
 const items=ADB.map((c,i)=>{const st=a[i]?'done':i===act?'now':'';const open=i===act;
  const ports=(i===3&&open)?`<div class="stack-s" style="margin-top:8px"><div class="card pad" style="background:var(--tonal);border-color:transparent"><p class="t-label">Pairing port</p><p class="t-body">From the popup. Used once.</p><div class="field" style="margin-top:6px"><input aria-label="Pairing code" placeholder="6-digit pairing code" inputmode="numeric"></div><div class="field" style="margin-top:6px"><input aria-label="Pairing port" placeholder="Pairing port" inputmode="numeric"></div></div><p class="t-body">Pairing port and connection port are different numbers. Android changes them each session.</p></div>`:(i===4&&open)?`<div class="stack-s" style="margin-top:8px"><div class="card pad" style="background:var(--tonal);border-color:transparent"><p class="t-label">Connection port</p><p class="t-body">Beside the IP address. Not the pairing port.</p><div class="field" style="margin-top:6px"><input aria-label="Connection port" placeholder="Connection port" inputmode="numeric"></div></div></div>`:'';
  return `<div class="card pad" style="${open?'border-color:var(--primary)':''}"><div style="display:flex;gap:12px;align-items:center"><span class="dot ${st}">${a[i]?ic('check'):i+1}</span><p class="t-title" style="flex:1">${c[0]}</p>${a[i]?ready():open?chip('attn','Now'):chip('off','Waiting')}</div>${open?`<p class="t-body" style="margin-top:8px">${c[1]}</p>${c[2]?`<p class="t-body" style="margin-top:4px">${c[2]}</p>`:''}${ports}<div class="stack-s" style="margin-top:10px">${actbtn(i===4?'Connect':'Check','adb.pass','primary')}${demoLink('Simulate a failure','s09')}</div>`:''}</div>`}).join('');
 const all=done===5;return scr(`${topbar('s03')}<h2 class="t-head">Connect the helper</h2><p class="t-body" role="status">${all?'Connected and verified.':'Five quick checks. EQO verifies each one.'}</p><div class="gap"></div><div class="stack">${items}</div><div class="grow"></div>${all?btn('Continue','s10'):''}`)});
def('s09','UF-04 Wireless ADB','ADB failure and repair (S-09)','REQ-ADB-05/11, REQ-REC-06','USER-FLOWS UF-04, UF-R2','Failure copy says what to check. After a restart or revoke, pairing starts fresh; EQO never reconnects silently.',()=>{
 const v=cur('s09','port');const D={
 port:['Pairing failed','Check the code and the pairing port. That\'s the small number in the pairing popup, not the one beside your IP address.','Try pairing again'],
 conn:['Couldn\'t connect','Use the connection port beside your IP address on the main Wireless debugging screen. It differs from the pairing port.','Try connecting again'],
 reboot:['Connection dropped','Your phone restarted. Pair again; Android may show a new code.','Pair again'],
 revoked:['Access was revoked','You revoked debugging access in Android settings, so EQO paused. Pair again to continue.','Pair again']}[v];
 return scr(`${topbar('s08')}<h2 class="t-head">Helper needs attention</h2>${vtabs('s09',[['port','Pairing'],['conn','Connect'],['reboot','Restart'],['revoked','Revoked']],v)}<div class="gap"></div><div class="err" role="status"><p class="t-title">${D[0]}</p><p class="t-body t-ink" style="margin-top:4px">${D[1]}</p></div><div class="grow"></div>${btn(D[2],'s08')}`)});
def('s10','UF-05 Helper','Helper authorization (S-10)','REQ-ADB-07','USER-FLOWS UF-05 step 2','The dialog is Android\'s, with Android\'s buttons. EQO only waits and reports what happened.',()=>sysScreen(`<div class="grow"></div><div class="sys" role="dialog" aria-label="Allow EQO to use the helper"><h3>Allow EQO to use the helper?</h3><p>This lets EQO run commands you approve.</p><div class="act"><button data-go="s10d">Don't allow</button><button data-go="s11">Allow</button></div></div><div class="grow"></div>`,'Android system dialog, not EQO'));
def('s10d','UF-05 Helper','Authorization declined','REQ-ADB-07','USER-FLOWS UF-05 step 2','Plain consequence, one next action.',()=>scr(`${topbar('s08')}<h2 class="t-head">Not allowed</h2><div class="err"><p class="t-title">EQO can't run helper tasks yet</p><p class="t-body t-ink" style="margin-top:4px">It needs your permission first. Your checks are saved.</p></div><div class="grow"></div>${btn('Ask again','s10')}${btn('Not now','s03','text')}`));
def('s11','UF-05 Helper','Helper check (S-11)','REQ-ADB-08/09/10','USER-FLOWS UF-05 steps 1, 3, 4','Connection checks and tests are separate. A test count appears only for tests that are turned on. Health is its own line.',()=>{
 const v=cur('s11','ok');
 if(v==='fail')return scr(`${topbar('s10')}<h2 class="t-head">Helper didn't start</h2>${vtabs('s11',[['ok','Passed'],['fail','Failed']],v)}<div class="gap"></div><div class="err" role="status"><p class="t-title">The helper didn't start</p><p class="t-body t-ink" style="margin-top:4px">This can happen after an update or restart. Try again; your connection checks are saved.</p></div><div class="grow"></div>${btn('Try again','s11')}`);
 return scr(`${topbar('s10')}<h2 class="t-head">Helper check</h2>${vtabs('s11',[['ok','Passed'],['fail','Failed']],v)}<div class="gap"></div><p class="t-label" style="margin-bottom:6px">Connection</p><div class="card pad"><div class="run"><div class="s"><span class="dot done">${ic('check')}</span><span>Started</span><small>${ready()}</small></div><div class="s"><span class="dot done">${ic('check')}</span><span>Authorized</span><small>${ready()}</small></div><div class="s"><span class="dot done">${ic('check')}</span><span>Healthy, checked just now</span><small>${ready()}</small></div></div></div><div class="gap"></div><p class="t-label" style="margin-bottom:6px">1 of 1 tests passed</p><div class="card pad"><div class="run"><div class="s"><span class="dot done">${ic('check')}</span><span>Echo test</span><small>${chip('ready','Passed','check')}</small></div><div class="s"><span class="dot">–</span><span>Display control</span><small>Off</small></div><div class="s"><span class="dot">–</span><span>Browser channel</span><small>Off</small></div></div></div><div class="grow"></div>${actbtn('Done','helper.done')}`)});
def('s12','UF-06 Browser control','Browser control: consent (S-12)','REQ-CDP-01, REQ-PRIV-03/04','USER-FLOWS UF-06 step 1','Optional capability with informed consent. Declining changes nothing else in the app.',()=>scr(`${topbar('s03')}<div class="ico" style="width:48px;height:48px;border-radius:16px">${ic('globe')}</div><div class="gap-s"></div><h2 class="t-head">Browser control</h2><p class="t-body">EQO can read and use pages in Chrome through Chrome's debugging tools.</p><div class="gap"></div><div class="card pad"><p class="t-title" style="margin-bottom:6px">Please know</p><ul class="list"><li>${ic('check')}<span>Page content and EQO's actions go to your AI model.</span></li><li>${ic('check')}<span>Redaction is best-effort. Private details may still be seen.</span></li><li>${ic('check')}<span>EQO uses this only for tasks you start, and only after you agree.</span></li></ul></div><div class="grow"></div>${btn('I understand','s13')}${actbtn('Not now','browser.decline','soft')}${btn('What exactly is sent?','s12i','text')}`));
def('s12i','UF-06 Browser control','What is sent (S-12 detail)','REQ-PRIV-04','USER-FLOWS UF-01 and UF-06 (button)','A concrete answer. The list is a draft until the privacy review.',()=>scr(`${topbar('s12')}<h2 class="t-head">What is sent</h2><div class="card pad"><ul class="list"><li>${ic('check')}<span>A summary of the page you asked EQO to use.</span></li><li>${ic('check')}<span>The steps EQO plans to take.</span></li><li>${ic('x')}<span>Never your API key, or pages you didn't ask for.</span></li></ul></div><p class="t-body" style="margin-top:10px">Draft list. The final text comes from the privacy review.</p><div class="grow"></div>${btn('Back','s03','soft')}`));
def('s13','UF-06 Browser control','Prepare Chrome (S-13)','REQ-CDP-02','USER-FLOWS UF-06 step 2','EQO cannot change Chrome settings, so it says so, lets the person do it, then verifies the endpoint itself.',()=>{const ok=S.chromeDebug;const v=cur('s13','ok');
 if(v==='fail')return scr(`${topbar('s12')}<h2 class="t-head">Prepare Chrome</h2>${vtabs('s13',[['ok','Passed'],['fail','Failed']],v)}<div class="gap"></div><div class="err" role="status"><p class="t-title">Chrome's debugging isn't available yet</p><p class="t-body t-ink" style="margin-top:4px">Check the setting and restart Chrome.</p></div><div class="grow"></div>${btn('Check again','s13')}`);
 return scr(`${topbar('s12')}<h2 class="t-head">Prepare Chrome</h2>${vtabs('s13',[['ok','Passed'],['fail','Failed']],v)}<div class="gap"></div><p class="t-body">Chrome must allow debugging first. EQO can't change this for you.</p><div class="gap"></div><div class="path"><b>Steps for your Chrome version:</b> follow the setting shown here, then restart Chrome. (Exact steps pending device testing.)</div>${ok?`<div class="gap"></div><div class="card pad" role="status"><div class="run"><div class="s"><span class="dot done">${ic('check')}</span><span>Chrome is ready for EQO</span><small>${ready()}</small></div></div></div>`:`<p class="t-body" style="margin-top:10px" role="status">${S.v.chk?'Checking Chrome…':''}</p>`}<div class="grow"></div>${ok?btn('Continue','s14'):actbtn('I restarted Chrome','chrome.check')}`)});
def('s14','UF-06 Browser control','Browser control readiness (S-14)','REQ-CDP-03/04','USER-FLOWS UF-06 step 3','Per-function results with a count. Never one unexplained "ready".',()=>scr(`${topbar('s13')}<h2 class="t-head">Browser control is ready</h2><p class="t-title">3 of 3 functions work</p><div class="gap"></div><div class="card pad"><div class="run"><div class="s"><span class="dot done">${ic('check')}</span><span>Read a page</span><small>${chip('ready','Passed','check')}</small></div><div class="s"><span class="dot done">${ic('check')}</span><span>Click</span><small>${chip('ready','Passed','check')}</small></div><div class="s"><span class="dot done">${ic('check')}</span><span>Run a script</span><small>${chip('ready','Passed','check')}</small></div></div></div><div class="grow"></div>${actbtn('Done','browser.done')}`));
def('s15','UF-07 Background mode','Background mode (S-15)','REQ-VD-03','USER-FLOWS UF-07','Honest about limits: compatible apps only, never a guarantee.',()=>scr(`${topbar('s03')}<div class="ico" style="width:48px;height:48px;border-radius:16px">${ic('layers')}</div><div class="gap-s"></div><h2 class="t-head">Background mode</h2><p class="t-body">EQO works on a separate virtual screen while you keep using your phone. It works only with compatible apps, and not with every app.</p><div class="gap"></div><div class="card"><div class="row slim" style="cursor:default"><span class="t"><p class="t-title">Messages</p></span>${chip('ready','Compatible','check')}</div><div class="row slim" style="cursor:default"><span class="t"><p class="t-title">Chrome</p></span>${chip('ready','Compatible','check')}</div><div class="row slim" style="cursor:default"><span class="t"><p class="t-title">Banking apps</p></span>${chip('off','Not supported here')}</div></div><div class="grow"></div>${actbtn('Turn on','vd.on')}${demoLink('See what a failure looks like','s16')}`));
def('s16','UF-07 Background mode','Foreground fallback (S-16)','REQ-VD-01/02/04','USER-FLOWS UF-07 step 3','Explicit approval is required. EQO never continues in the background without asking.',()=>scr(`${topbar('s15')}<h2 class="t-head">Run in the foreground?</h2><div class="attn"><p class="t-title">EQO couldn't start a virtual screen</p><p class="t-body t-ink" style="margin-top:4px">The helper didn't respond. Run in the foreground instead? You'll see EQO work and can pause any time.</p></div><div class="grow"></div>${actbtn('Run in foreground','fg.on')}${btn('Cancel task','s20','soft')}`));
def('s19','UF-08 Readiness','Readiness dashboard (S-19)','REQ-ADB-10, REQ-CDP-04','USER-FLOWS UF-08','Every named check with its own state. Tap a row to re-check just that one.',()=>{
 const r=(t,ok,k)=>`<button class="row slim" data-act="recheck" data-k="${k}"><span class="t"><p class="t-title" style="font-weight:500">${t}</p></span>${ok?ready():chip('todo','Not set up')}</button>`;
 const note=S.v.rechecked?`<p class="t-body" role="status" style="margin:8px 4px 0">${S.v.rechecked}: checked just now.</p>`:'';
 return scr(`${topbar('s03')}<h2 class="t-head">Readiness</h2><p class="t-body">Each check stands alone. Green means exactly that.</p><div class="gap"></div><p class="t-label" style="margin-bottom:4px">Setup</p><div class="card">${r('Model',S.model,'Model')}${r('Screen control service',S.a11y,'Screen control')}</div><div class="gap-s"></div><p class="t-label" style="margin:8px 0 4px">Helper</p><div class="card">${r('Developer options',S.adb[0],'Developer options')}${r('Wi-Fi',S.adb[1],'Wi-Fi')}${r('Wireless debugging',S.adb[2],'Wireless debugging')}${r('Paired (pairing port)',S.adb[3],'Pairing')}${r('Connected (connection port)',S.adb[4],'Connection')}${r('Helper started',S.helper,'Helper start')}${r('Helper authorized',S.helper,'Helper authorization')}${r('Helper healthy',S.helper,'Helper health')}${r('Echo test',S.helper,'Echo test')}</div><div class="gap-s"></div><p class="t-label" style="margin:8px 0 4px">Optional</p><div class="card">${r('Browser: read, click, script',S.browser==='ready','Browser control')}${r('Display control test',S.vd==='ready','Display test')}${r('Messages (SMS)',S.sms==='ready','SMS')}</div>${note}`)});
def('s20','UF-09 Tasks','Home and chat (S-20)','REQ-TASK-01','USER-FLOWS UF-09','Plain, with example tasks to try. Voice is an open question (CF-09), so it is not shown.',()=>scr(`<div class="top"><span class="brand">EQO</span><button class="back" data-go="s27" aria-label="Settings" style="margin-inline-start:auto;margin-inline-end:-10px">${ic('cog')}</button></div><h2 class="sr-only">Home</h2><div class="stack" style="margin-top:6px"><div class="bubble b-ai">What would you like done? I'll ask before anything sensitive.</div><div class="suggest"><button data-go="s21">Text Sam I'm on my way</button><button data-go="s21">Find an open pharmacy</button></div>${S.v.toast?`<div class="bubble b-ai" role="status">${S.v.toast}</div>`:''}</div><div class="grow"></div><div class="composer"><span>Ask EQO</span><button class="send" data-go="s21" aria-label="Send">${ic('send')}</button></div>`));
def('s21','UF-09 Tasks','Task run with controls (S-21, S-23)','REQ-TASK-01/03/05','USER-FLOWS UF-09, UF-10 section 11.2','Pause, Take over and Stop carry their literal descriptions. Paused says nothing is running. Take over keeps observation off unless the person allows it.',()=>{
 const st=S.runStep,paused=S.paused,took=S.tookOver;
 const names=['Open Messages','Write the message','Send it (needs your OK)','Check it was sent'];const ing=['opening Messages','writing the message','sending it, after your OK','checking it was sent'];
 const li=names.map((s,i)=>`<div class="s"><span class="dot ${i<st?'done':i===st?'now':''}">${i<st?ic('check'):i+1}</span><span>${s}</span><small>${i<st?'Done':i===st?'Running · 0:12':'Waiting'}</small></div>`).join('');
 const msg=took?"You're driving. EQO is holding.":paused?"Paused. EQO isn't reading your screen or calling the model. Resume when ready.":`Working on it. Step ${st+1} of 4: ${ing[st]}.`;
 const badge=took?`<span class="badge">${ic('eye')} ${S.observe?'Observing (you allowed it)':'Not observing'}</span>`:paused?chip('attn','Paused, steps kept'):chip('todo','Running');
 const fg=S.fg?`<div style="margin-top:6px">${chip('off','Foreground (background mode unavailable)')}</div>`:'';
 const watch=took?`<div class="card pad" style="margin-top:10px"><div style="display:flex;align-items:center;gap:12px"><div style="flex:1"><p class="t-title">Let EQO watch while you drive?</p><p class="t-body">Off by default. EQO won't read the screen unless you allow it.</p></div><button class="tog" role="switch" aria-checked="${S.observe?'true':'false'}" aria-label="Let EQO watch while you drive" data-act="observe.toggle"></button></div></div>`:'';
 return scr(`<div class="top"><span class="brand">EQO</span><span style="margin-inline-start:auto">${badge}</span></div><h2 class="t-head">Text Sam I'm on my way</h2>${fg}<div class="gap"></div><div class="run">${li}</div><div class="gap"></div><p class="t-body" role="status">${msg}</p><details class="disc" style="margin-top:8px"><summary>What the model sees</summary><p class="t-body">A summary of the current screen, with private details hidden where possible.</p></details>${watch}<div class="grow"></div>${paused||took?actbtn('Resume','run.resume'):`<button class="btn btn-soft review" data-demo="1" data-act="run.next">Demo: next step</button>`}<div class="gap-s"></div>${controls()}`)});
def('s22','UF-10 Approvals','Approval card (S-22)','REQ-TASK-02','USER-FLOWS UF-10 section 11.1','Approve or Deny with a visible timer. Back means Deny and says so. Timeout also denies. EQO never auto-approves.',()=>scr(`<div class="top"><button class="back" data-go="s22d" aria-label="Back, which denies"><span class="flip">${ic('back')}</span></button><span style="margin-inline-start:auto">${chip('attn','Needs your OK')}</span></div><h2 class="t-head">Text Sam I'm on my way</h2><div class="gap-s"></div><div class="attn" role="alert"><p class="t-title">Messages wants to send this to Sam</p><div class="quote">"On my way, back in 20 minutes"<div class="t-label" style="color:var(--muted);margin-top:4px;font-weight:500">To: Sam</div></div><div class="pair">${btn('Approve','s24')}${btn('Deny','s22d','soft')}</div><div style="margin-top:10px">${chip('off','Auto-denies in 60 s')}</div></div><p class="t-body" style="margin:8px 4px 0">Back also denies. Nothing is sent.</p><div class="grow"></div>${controls()}`));
def('s22d','UF-10 Approvals','Denied or cancelled','REQ-TASK-02, REQ-TASK-07','USER-FLOWS UF-10','Calm confirmation that nothing happened. The task asks how to continue; it does not retry by itself.',()=>{const v=cur('s22d','denied');const D=v==='denied'?['Denied','Nothing was sent. What next?']:['Cancelled','The screen changed while waiting, so EQO cancelled that step. Nothing was sent.'];
 return scr(`${topbar('s22')}<h2 class="t-head">${D[0]}</h2>${vtabs('s22d',[['denied','Denied'],['changed','Screen changed']],v)}<div class="gap"></div><div class="card pad" role="status"><p class="t-body t-ink">${D[1]}</p></div><div class="grow"></div>${btn('Edit the message','s26')}${btn('End task','s24s','soft')}`)});
def('s24','UF-11 Result','Result verification (S-24)','REQ-TASK-06','USER-FLOWS UF-11','Receipts, then the person decides whether it was right. EQO never claims success it did not verify.',()=>scr(`${topbar('s20')}<h2 class="t-head">Done</h2><p class="t-body">Here's what happened.</p><div class="gap"></div><div class="card pad"><div class="run"><div class="s"><span class="dot done">${ic('check')}</span>Opened Messages</div><div class="s"><span class="dot done">${ic('check')}</span>Wrote the message</div><div class="s"><span class="dot done">${ic('check')}</span>Sent it, with your approval</div></div></div><div class="gap"></div><p class="t-title">Did it do what you asked?</p><div class="grow"></div>${actbtn('Looks right','res.ok')}${actbtn('Looks wrong','res.bad','soft')}`));
def('s24s','UF-10 Approvals','Task stopped','REQ-TASK-03','USER-FLOWS UF-10 section 11.2','"Stopped" means the task ended, and the chip says so. Different from Paused.',()=>scr(`${topbar('s20')}<h2 class="t-head">Stopped</h2><div class="card pad"><p class="t-title">The task ended</p><p class="t-body" style="margin-top:4px">Here's what ran before you stopped it.</p><div class="run" style="margin-top:10px"><div class="s"><span class="dot done">${ic('check')}</span>Opened Messages</div><div class="s"><span class="dot done">${ic('check')}</span>Wrote the message</div><div class="s"><span class="dot">3</span>Send it. Not done.</div></div></div><div class="grow"></div>${btn('Back to home','s20')}`));
def('s25','UF-12 Recovery','Recovery hub (S-25)','REQ-REC-01..10, REQ-TASK-07','USER-FLOWS UF-11, UF-12 (R1 to R8)','One calm card per problem with a single next action that returns to the failed step. Nothing resumes or retries by itself.',()=>{
 const v=cur('s25','rate');const D={
 rate:['Too many requests','EQO won\'t retry on its own. Try again in 40 seconds, or stop.','Try again','s21'],
 adb:['Helper disconnected','Reconnect with the pairing steps. Android may show a new code.','Reconnect','s08'],
 a11y:['Screen control is off','The task paused at step 3. Turn it on again, then resume.','Open Screen control','s06'],
 helper:['Helper stopped responding','EQO will re-run its checks.','Check the helper','s11'],
 unsure:['Not sure it finished','This step may have partly run. Check Messages before resuming.','I checked','s21'],
 chrome:['Chrome debugging is off','Chrome may have restarted. EQO will re-check.','Re-check Chrome','s13'],
 revoked:['Helper access turned off','You changed a setting, so EQO paused. Turn it on when you want to continue.','Review setting','s08'],
 update:['Helper needs a restart','EQO was updated. The helper needs a quick restart.','Restart helper','s11']}[v];
 return scr(`${topbar('s20')}<h2 class="t-head">Needs attention</h2>${vtabs('s25',[['rate','Limit'],['adb','Helper'],['a11y','Screen'],['helper','Stopped'],['unsure','Unsure'],['chrome','Chrome'],['revoked','Access'],['update','Update']],v)}<div class="gap"></div><div class="err" role="status" style="background:var(--attn-bg)"><p class="t-title" style="color:var(--attn)">${D[0]}</p><p class="t-body t-ink" style="margin-top:4px">${D[1]}</p></div><p class="t-body" style="margin:10px 4px 0">Resuming asks again before anything sensitive. An earlier approval is never reused.</p><div class="grow"></div>${btn(D[2],D[3])}${btn('Stop the task','s24s','soft')}`)});
def('s26','UF-13 SMS','SMS draft (S-26)','REQ-SMS-01/03/04','USER-FLOWS UF-13','Compose first, send second. EQO has no inbox access, so no screen mentions reading messages.',()=>scr(`${topbar('s26x')}<h2 class="t-head">Draft ready</h2><p class="t-body">Nothing is sent yet.</p><div class="gap"></div><div class="card pad"><p class="t-label" style="color:var(--muted)">To</p><p class="t-title">Sam</p><p class="t-label" style="color:var(--muted);margin-top:10px">Message</p><p class="t-ink" style="margin:0">On my way, back in 20 minutes</p></div><div class="grow"></div>${btn('Send…','s26c')}${btn('Edit','s26','soft')}${btn('Use my messaging app','s26h','text')}`));
def('s26x','UF-13 SMS','Draft saved (back from S-26)','REQ-SMS-02','USER-FLOWS UF-13 step 2','Going back keeps the draft and sends nothing.',()=>scr(`${topbar('s03')}<h2 class="t-head">Draft saved</h2><div class="card pad" role="status"><p class="t-body t-ink">Nothing was sent. You can come back to it.</p></div><div class="grow"></div>${btn('Open the draft','s26')}${btn('Done','s03','soft')}`));
def('s26c','UF-13 SMS','SMS confirmation','REQ-SMS-02','USER-FLOWS UF-13 step 2','Full recipient and full text before anything leaves, plus the cost note.',()=>scr(`${topbar('s26')}<h2 class="t-head">Send this SMS?</h2><div class="attn"><p class="t-title">To: Sam</p><div class="quote">"On my way, back in 20 minutes"</div><p class="t-body t-ink">Uses your carrier plan.</p></div><div class="grow"></div>${actbtn('Send now','sms.send')}${btn('Cancel','s26d','soft')}`));
def('s26d','UF-13 SMS','SMS cancelled','REQ-SMS-02','USER-FLOWS UF-13 step 2','Reassurance: nothing sent, draft kept.',()=>scr(`${topbar('s26')}<h2 class="t-head">Nothing sent</h2><div class="card pad" role="status"><p class="t-body t-ink">Your draft is saved.</p></div><div class="grow"></div>${btn('Back to draft','s26')}`));
def('s26h','UF-13 SMS','SMS hand-off','REQ-SMS-04','USER-FLOWS UF-13 step 3','Shown when direct sending is not available on this phone.',()=>scr(`${topbar('s26')}<h2 class="t-head">Send it yourself</h2><div class="card pad"><p class="t-body t-ink">EQO can't send SMS directly on this phone. Open the draft in your messaging app.</p></div><div class="grow"></div>${btn('Open messaging app','s26')}`));
def('s27','UF-14 Settings','Settings (S-27)','REQ-INS-03','USER-FLOWS S-27','Legal is two taps from Home, within the three-tap rule.',()=>scr(`${topbar('s20')}<h2 class="t-head">Settings</h2><div class="gap"></div><div class="card">${row('key','Model','OpenRouter',S.model?ready():chip('todo','Not set up'),'s04')}${row('shield','Privacy','What EQO sends','','s12i')}${row('list','Readiness','Every check','','s19')}${row('refresh','Set up again','Redo one step','','s29')}${row('doc','Legal and licenses','Works offline','','s28')}</div>`));
def('s28','UF-14 Legal','Legal notices (S-28)','REQ-INS-03','USER-FLOWS UF-14','The only place upstream project names appear. Always available, even offline.',()=>scr(`${topbar('s27')}<h2 class="t-head">Licenses and notices</h2><p class="t-body">Always available, even offline.</p><div class="gap"></div><div class="card"><div class="row slim" style="cursor:default"><span class="t"><p class="t-title">OpenDroid</p><small>Apache-2.0</small></span></div><div class="row slim" style="cursor:default"><span class="t"><p class="t-title">ClosePaw</p><small>Apache-2.0</small></span></div><div class="row slim" style="cursor:default"><span class="t"><p class="t-title">Shizuku</p><small>Apache-2.0</small></span></div><div class="row slim" style="cursor:default"><span class="t"><p class="t-title">Shizuku-API</p><small>MIT</small></span></div></div><p class="t-body" style="margin-top:10px">Attribution wording is a placeholder until legal review.</p>`));
def('s29','UF-12 Recovery','Set up again (S-29)','REQ-ADB-12','USER-FLOWS S-29','Only the affected step is re-entered. Completed steps stay green until their own check fails.',()=>scr(`${topbar('s27')}<h2 class="t-head">Set up again</h2><p class="t-body">Pick a step to redo. Everything else stays as is.</p><div class="gap"></div><div class="card">${row('key','Model','Required',S.model?ready():chip('todo','Not set up'),'s04')}${row('screen','Screen control','Required',chip('attn','Needs attention'),'s06')}${row('plug','Helper connection','Required',S.helper?ready():chip('todo','Not set up'),'s08')}</div>`));
const NAV=[['UF-01 First install',['s01','s02','s03']],['UF-02 Model setup',['s04','s05']],['UF-03 Screen control',['s06','s06b','s07','s07i']],['UF-04 Wireless ADB',['s08','s09']],['UF-05 Helper',['s10','s10d','s11']],['UF-06 Browser control',['s12','s12i','s13','s14']],['UF-07 Background mode',['s15','s16']],['UF-08 Readiness',['s19']],['UF-09 Tasks',['s20','s21']],['UF-10 Approvals',['s22','s22d','s24s']],['UF-11 Result',['s24']],['UF-12 Recovery',['s25','s29']],['UF-13 SMS',['s26','s26x','s26c','s26d','s26h']],['UF-14 Settings and legal',['s27','s28']]];
let CUR='s01';const phone=document.getElementById('phone'),screen=document.getElementById('screen');
function esc(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function buildNav(){document.getElementById('flows').innerHTML=NAV.map(([f,ids])=>`<h2>${f}</h2>`+ids.map(i=>`<a href="#${i}" data-id="${i}"${i===CUR?' aria-current="page"':''}>${esc(SC[i].title)}</a>`).join('')).join('')}
function render(focus){const s=SC[CUR];if(!s){CUR='s01';return render()}
 screen.innerHTML=s.render();screen.scrollTop=0;
 if(focus!==false){const h=screen.querySelector('h2,h3');if(h){h.setAttribute('tabindex','-1');try{h.focus({preventScroll:true})}catch(e){}}}
 document.getElementById('notes').innerHTML=`<h2>${esc(s.title)}</h2><span class="tag">${esc(s.flow)}</span>${s.reqs.split(',').map(r=>`<span class="tag">${esc(r.trim())}</span>`).join('')}<dl><dt>Why it is designed this way</dt><dd>${esc(s.note)}</dd><dt>Copy source</dt><dd>${esc(s.src)}</dd></dl>`;
 buildNav();document.title='EQO prototype: '+s.title}
function go(id){CUR=id;if(location.hash!=='#'+id)history.replaceState(null,'','#'+id);render()}
const ACT={
 'model.test':()=>{S.v.test='run';render(false);setTimeout(()=>{S.v.test='pass';render(false)},900)},
 'model.done':()=>{S.model=true;go('s03')},
 'a11y.toggle':()=>{S.v.a11ytog=!S.v.a11ytog;render(false)},'a11y.return':()=>{S.a11y=true;go('s06')},'restr.toggle':()=>{S.v.restr=!S.v.restr;render(false)},
 'adb.pass':()=>{const i=S.adb.findIndex(x=>!x);if(i>=0)S.adb[i]=true;render(false)},
 'helper.done':()=>{S.helper=true;go('s03')},
 'browser.decline':()=>{S.browser='declined';go('s03')},
 'chrome.check':()=>{S.v.chk=1;render(false);setTimeout(()=>{S.chromeDebug=true;render(false)},900)},
 'browser.done':()=>{S.browser='ready';go('s03')},
 'vd.on':()=>{S.vd='ready';go('s03')},'fg.on':()=>{S.fg=true;S.runStep=0;go('s21')},
 'run.next':()=>{if(S.runStep>=2){S.runStep=2;go('s22')}else{S.runStep++;render(false)}},
 'run.pause':()=>{S.paused=true;S.tookOver=false;go('s21')},'run.took':()=>{S.tookOver=true;S.paused=false;go('s21')},'run.resume':()=>{S.paused=false;S.tookOver=false;render(false)},'observe.toggle':()=>{S.observe=!S.observe;render(false)},
 'res.ok':()=>{S.v.toast='Thanks. Marked as done.';go('s20')},'res.bad':()=>{S.v.toast='Marked as needs review. Nothing else changed.';go('s20')},
 'sms.send':()=>{S.sms='ready';go('s24')},
 'recheck':(el)=>{S.v.rechecked=el.dataset.k;render(false)}
};
document.addEventListener('click',e=>{
 const t=e.target.closest('[data-go],[data-act],[data-var]');if(t){
  if(t.dataset.go){go(t.dataset.go)}
  else if(t.dataset.act){(ACT[t.dataset.act]||(()=>{}))(t)}
  else if(t.dataset.var){const[k,v]=t.dataset.var.split(':');S.v[k]=v;render(false)}
  return}
 const a=e.target.closest('nav.flows a');if(a){e.preventDefault();go(a.dataset.id)}
 const fs=e.target.closest('#seg-fs button');if(fs){document.querySelectorAll('#seg-fs button').forEach(b=>b.setAttribute('aria-pressed',b===fs));phone.style.setProperty('--fs',fs.dataset.fs)}
 const d=e.target.closest('#seg-dir button');if(d){document.querySelectorAll('#seg-dir button').forEach(b=>b.setAttribute('aria-pressed',b===d));phone.setAttribute('dir',d.dataset.dir)}
 if(e.target.closest('#reset')){S=fresh();go('s01')}
});
window.addEventListener('hashchange',()=>{const id=location.hash.slice(1);if(SC[id]&&id!==CUR){CUR=id;render()}});
window.EQO={SC,NAV,go,reset(){S=fresh()},get S(){return S}};
CUR=(SC[location.hash.slice(1)]?location.hash.slice(1):'s01');render(false);
</script>
</body>
</html>
